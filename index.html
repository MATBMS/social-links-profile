<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">

  <title>Social links profile</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="card">
    <img class="card-avatar" src="./images/avatar-jessica.jpeg" alt="Jessica Randall" width="88" height="88">

    <div class="card-heading">
      <h1 class="card-name">Jessica Randall</h1>
      <p class="card-location">London, United Kingdom</p>
    </div>

    <p class="card-bio">"Front-end developer and avid reader."</p>

    <ul class="links">
      <li><a class="link" href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a></li>
      <li><a class="link" href="https://www.frontendmentor.io" target="_blank" rel="noopener noreferrer">Frontend Mentor</a></li>
      <li><a class="link" href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      <li><a class="link" href="https://twitter.com" target="_blank" rel="noopener noreferrer">Twitter</a></li>
      <li><a class="link" href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a></li>
    </ul>
  </main>
</body>
</html>
