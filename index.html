<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">

  <title>Social links profile</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="card">
    <img class="card-avatar" src="./images/avatar-jessica.jpeg" alt="Portrait of Jessica Randall" width="88" height="88">

    <div class="card-heading">
      <h1 class="card-name">Jessica Randall</h1>
      <p class="card-location">London, United Kingdom</p>
    </div>

    <p class="card-bio">"Front-end developer and avid reader."</p>

    <ul class="links">
      <li><button class="link" type="button" data-url="https://github.com"><span class="link-text">GitHub</span></button></li>
      <li><button class="link" type="button" data-url="https://www.frontendmentor.io"><span class="link-text">Frontend Mentor</span></button></li>
      <li><button class="link" type="button" data-url="https://www.linkedin.com"><span class="link-text">LinkedIn</span></button></li>
      <li><button class="link" type="button" data-url="https://twitter.com"><span class="link-text">Twitter</span></button></li>
      <li><button class="link" type="button" data-url="https://www.instagram.com"><span class="link-text">Instagram</span></button></li>
    </ul>
  </main>

  <script src="./script.js"></script>
</body>
</html>
